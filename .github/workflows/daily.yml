name: daily data update

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch: # lets you run it manually from the Actions tab

concurrency:
  group: daily-data
  cancel-in-progress: false

env:
  # Refuse to start below this much free disk rather than dying half way
  # through pip with a corrupt venv.
  #
  # Tier-calibrated: the data tier installs to 195 MB measured, and pip still
  # needs transient space to download and extract the largest wheel even with
  # --no-cache-dir, so the gate allows roughly 2.5x the installed size.
  #
  # An earlier value of 2000 was carried over from when BOTH jobs installed
  # the full 855 MB requirements.txt. After the tier split that threshold
  # blocked runs which would have succeeded: run 43719572988 reclaimed disk
  # to 942 MB free and was then refused by its own preflight.
  MIN_FREE_MB: "500"

jobs:
  update:
    runs-on: self-hosted

    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      # The runner is self-hosted and persistent, so disk is a finite shared
      # resource rather than a fresh 14 GB every run. On 2026-11-12 this job
      # died mid-pip with [Errno 28] No space left on device (0 MB free) and
      # the pipeline stayed down for four days, losing forecast-log rows that
      # cannot be backfilled. Three changes keep that from recurring:
      #   1. install the narrowest requirements tier the job actually imports
      #   2. reuse the venv unless its tier file changed, instead of
      #      recreating it nightly
      #   3. never leave a pip HTTP cache behind
      # Runs BEFORE the free-space gate on purpose. The runner is currently
      # at 0 MB, and a gate that refuses to start would otherwise block the
      # one step that reclaims the space - the pipeline could never heal
      # itself. Both actions below are idempotent and harmless on a healthy
      # runner: the venv is rebuilt from a pinned tier file, and pip's HTTP
      # cache is pure disk growth on a persistent runner.
      - name: Reclaim disk before setup
        run: |
          before=$(df -Pm . | awk 'NR==2 {print $4}')
          want=$(sha256sum requirements-data.txt | cut -d" " -f1)
          have=$(cat .venv/.req-sha 2>/dev/null || echo none)
          if [ "$want" != "$have" ]; then
            sz=$(du -sm .venv 2>/dev/null | cut -f1 || echo 0)
            echo "removing stale venv (${sz:-0} MB) - tier file changed or venv absent"
            rm -rf .venv
          else
            echo "venv matches requirements-data.txt - keeping it"
          fi
          rm -rf "${PIP_CACHE_DIR:-$HOME/.cache/pip}"
          after=$(df -Pm . | awk 'NR==2 {print $4}')
          echo "free: ${before} MB -> ${after} MB"

      - name: Preflight - disk space
        run: |
          free_mb=$(df -Pm . | awk 'NR==2 {print $4}')
          echo "free space: ${free_mb} MB"
          df -h . || true
          if [ "$free_mb" -lt "$MIN_FREE_MB" ]; then
            echo "::error::only ${free_mb} MB free, need ${MIN_FREE_MB} MB. \
          Reclaim space on the runner: 'pip cache purge', remove stale \
          .venv directories, or prune docker/actions caches."
            exit 1
          fi

      - name: Set up Python virtual environment
        run: |
          want=$(sha256sum requirements-data.txt | cut -d" " -f1)
          have=$(cat .venv/.req-sha 2>/dev/null || echo none)
          if [ ! -x .venv/bin/python ] || [ "$want" != "$have" ]; then
            echo "building venv (requirements changed or venv absent)"
            rm -rf .venv          # no-op after the reclaim step; kept for
                                  # manual/workflow_dispatch robustness
            python3 -m venv .venv
            # --no-cache-dir: the wheel cache is pure growth on a persistent
            # runner and is what pushed this disk over the edge.
            .venv/bin/pip install --quiet --no-cache-dir --upgrade pip
            .venv/bin/pip install --quiet --no-cache-dir -r requirements-data.txt
            echo "$want" > .venv/.req-sha
          else
            echo "reusing venv (requirements-data.txt unchanged)"
          fi
          .venv/bin/python -c "import pandas, numpy; print('pandas', pandas.__version__)"

      # Cannot be backfilled - runs first so a later failure never costs us it
      - name: Log day-ahead weather forecast
        run: .venv/bin/python fetch_weather.py forecast

      - name: Fetch demand data
        run: .venv/bin/python fetch_demand.py

      - name: Fetch peak demand data
        continue-on-error: true
        env:
          INDIAN_PROXY: ${{ secrets.INDIAN_PROXY }}
        run: .venv/bin/python update_peak_demand.py

      - name: Backfill weather (first run only)
        run: |
          if [ ! -f data/weather_daily.csv ]; then
            echo "no weather history - running one-time backfill"
            .venv/bin/python fetch_weather.py backfill
          else
            echo "weather history present - skipping backfill"
          fi

      - name: Append recent actual weather
        run: .venv/bin/python fetch_weather.py update

      # 'update' rows come from the forecast model's own analysis, which runs
      # ~0.9 C off ERA5. This replaces them with reanalysis once ERA5 lands,
      # so the history every model trains on stays one consistent series.
      - name: Reconcile provisional weather to reanalysis
        run: .venv/bin/python fetch_weather.py reconcile

      - name: Rebuild dataset
        run: .venv/bin/python build_dataset.py

      - name: Health check
        run: .venv/bin/python health_check.py

      # always(): a failed health check still leaves data worth keeping, and
      # the forecast log in particular cannot be reconstructed tomorrow. The
      # run stays red; we just don't throw away what it collected.
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      # Runs even on failure: a half-finished pip leaves the cache behind, and
      # that is exactly the state where the next run needs the space most.
      - name: Reclaim disk
        if: always()
        run: |
          .venv/bin/pip cache purge 2>/dev/null || true
          echo "free space after: $(df -Pm . | awk 'NR==2 {print $4}') MB"

      - name: Open an issue if this run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily data update failed';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation'
            });

            const body = `Run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (existing.data.some(i => i.title === title)) {
              console.log('issue already open');
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automation']
              });
            }

      # The open issue is what suppresses the next one: the step above skips
      # when a matching issue is already open, so a stale issue from a recovered
      # outage would silently swallow the alert for a genuinely new failure.
      # Closing it on the first green run keeps that dedupe honest.
      - name: Close the failure issue once a run goes green
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily data update failed';

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation'
            });

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            for (const i of open.data.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: i.number,
                body: `Recovered: ${run}`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: i.number,
                state: 'closed'
              });
            }
