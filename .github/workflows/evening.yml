name: evening forecast

# Roadmap Phase 7.2. The morning job (daily.yml) collects data; this one
# issues the forecast.
#
# Why the evening, and why this is the latest sensible slot:
#   * Grid-India publishes day D's demand on D+1 (~09:00-11:00 IST, measured
#     in results/publish_time.json). Nothing we do tonight makes today's
#     demand appear, which is why H=2 and peak_lag_1 is unavailable.
#   * The weather forecast, though, is strictly better the later we ask.
#     An evening run gets a lead-1 forecast for tomorrow instead of the
#     lead-1-from-this-morning that daily.yml logs.
# So the evening slot buys fresher weather at no cost in demand staleness.
#
# Ordering is load-bearing: the logger must write tomorrow's forecast BEFORE
# predict_next_day.py reads it, or inference falls back to this morning's
# staler run (or fails outright if the log has no row for tomorrow).

on:
  schedule:
    - cron: "30 14 * * *"   # 20:00 IST
  workflow_dispatch:

concurrency:
  group: evening-forecast
  cancel-in-progress: false

env:
  # Tier-calibrated, same reasoning as daily.yml. The model tier installs to
  # 355 MB measured (it adds scipy, scikit-learn and lightgbm on top of the
  # data tier), so this gate sits higher than the morning job's 500 MB.
  MIN_FREE_MB: "800"

jobs:
  forecast:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The runner is self-hosted and persistent, so disk is a finite shared
      # resource rather than a fresh 14 GB every run. On 2026-11-12 this job
      # died mid-pip with [Errno 28] No space left on device (0 MB free) and
      # the pipeline stayed down for four days, losing forecast-log rows that
      # cannot be backfilled. Three changes keep that from recurring:
      #   1. install the narrowest requirements tier the job actually imports
      #   2. reuse the venv unless its tier file changed, instead of
      #      recreating it nightly
      #   3. never leave a pip HTTP cache behind
      # Runs BEFORE the free-space gate on purpose. The runner is currently
      # at 0 MB, and a gate that refuses to start would otherwise block the
      # one step that reclaims the space - the pipeline could never heal
      # itself. Both actions below are idempotent and harmless on a healthy
      # runner: the venv is rebuilt from a pinned tier file, and pip's HTTP
      # cache is pure disk growth on a persistent runner.
      - name: Reclaim disk before setup
        run: |
          before=$(df -Pm . | awk 'NR==2 {print $4}')
          want=$(sha256sum requirements-model.txt | cut -d" " -f1)
          have=$(cat .venv/.req-sha 2>/dev/null || echo none)
          if [ "$want" != "$have" ]; then
            sz=$(du -sm .venv 2>/dev/null | cut -f1 || echo 0)
            echo "removing stale venv (${sz:-0} MB) - tier file changed or venv absent"
            rm -rf .venv
          else
            echo "venv matches requirements-model.txt - keeping it"
          fi
          rm -rf "${PIP_CACHE_DIR:-$HOME/.cache/pip}"
          after=$(df -Pm . | awk 'NR==2 {print $4}')
          echo "free: ${before} MB -> ${after} MB"

      - name: Preflight - disk space
        run: |
          free_mb=$(df -Pm . | awk 'NR==2 {print $4}')
          echo "free space: ${free_mb} MB"
          df -h . || true
          if [ "$free_mb" -lt "$MIN_FREE_MB" ]; then
            echo "::error::only ${free_mb} MB free, need ${MIN_FREE_MB} MB. \
          Reclaim space on the runner: 'pip cache purge', remove stale \
          .venv directories, or prune docker/actions caches."
            exit 1
          fi

      - name: Set up Python virtual environment
        run: |
          want=$(sha256sum requirements-model.txt | cut -d" " -f1)
          have=$(cat .venv/.req-sha 2>/dev/null || echo none)
          if [ ! -x .venv/bin/python ] || [ "$want" != "$have" ]; then
            echo "building venv (requirements changed or venv absent)"
            rm -rf .venv          # no-op after the reclaim step; kept for
                                  # manual/workflow_dispatch robustness
            python3 -m venv .venv
            # --no-cache-dir: the wheel cache is pure growth on a persistent
            # runner and is what pushed this disk over the edge.
            .venv/bin/pip install --quiet --no-cache-dir --upgrade pip
            .venv/bin/pip install --quiet --no-cache-dir -r requirements-model.txt
            echo "$want" > .venv/.req-sha
          else
            echo "reusing venv (requirements-model.txt unchanged)"
          fi
          .venv/bin/python -c "import pandas, numpy; print('pandas', pandas.__version__)"

      # Must come first - predict_next_day.py reads what this writes.
      # Tagged `evening` so it does not overwrite the morning run's rows;
      # both slots are kept and inference prefers this one.
      - name: Log evening weather forecast
        run: .venv/bin/python fetch_weather.py forecast --slot=evening

      # Score yesterday's forecasts now that Grid-India has published.
      # Runs before inference so a failure here still leaves us a forecast.
      - name: Score matured forecasts
        continue-on-error: true
        run: .venv/bin/python track_predictions.py

      # --champion is load-bearing. Without it predict_next_day.py serves the
      # differenced HistGradientBoosting STAND-IN, not the frozen Phase 7
      # champion - which means every logged forecast would be evidence for a
      # model the paper does not describe. The stand-in was the right default
      # before a champion existed; it is not now.
      #
      # The serving path reads target_parameterisation and lag_representation
      # from the config and fails closed if either is wrong (see
      # tests/test_serving.py), so this cannot silently serve the wrong thing.
      - name: Issue tomorrow's forecast
        run: .venv/bin/python predict_next_day.py --champion models/champion_config.json

      # Refresh the file the public dashboard reads. Runs before the
      # commit step so the regenerated JSON is included in it.
      - name: Export dashboard data
        continue-on-error: true
        run: .venv/bin/python export_dashboard_data.py

      - name: Commit forecast and scores
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather_forecast_log.csv data/predictions_log.csv \
                  results/ dashboard/public/data/dashboard.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "forecast: $(date -u +%Y-%m-%d) evening"
            git pull --rebase --autostash
            git push
          fi

  # Hyperparameters are frozen (D5) but the fitted model and the conformal
  # calibration both need to track the current regime, so they are refreshed
  # on their own cadence rather than nightly.
  recalibrate:
    runs-on: self-hosted
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Shared with the other jobs on this runner - see the note in
      # requirements-model.txt about why all three use the same tier.
      - name: Reclaim disk before setup
        run: |
          before=$(df -Pm . | awk 'NR==2 {print $4}')
          want=$(sha256sum requirements-model.txt | cut -d" " -f1)
          have=$(cat .venv/.req-sha 2>/dev/null || echo none)
          if [ "$want" != "$have" ]; then
            echo "removing stale venv ($(du -sm .venv 2>/dev/null | cut -f1 || echo 0) MB)"
            rm -rf .venv
          else
            echo "venv matches requirements-model.txt - keeping it"
          fi
          rm -rf "${PIP_CACHE_DIR:-$HOME/.cache/pip}"
          echo "free: ${before} MB -> $(df -Pm . | awk 'NR==2 {print $4}') MB"

      - name: Preflight - disk space
        run: |
          free_mb=$(df -Pm . | awk 'NR==2 {print $4}')
          echo "free space: ${free_mb} MB"
          if [ "$free_mb" -lt "$MIN_FREE_MB" ]; then
            echo "::error::only ${free_mb} MB free, need ${MIN_FREE_MB} MB."
            exit 1
          fi

      - name: Set up Python virtual environment
        run: |
          want=$(sha256sum requirements-model.txt | cut -d" " -f1)
          have=$(cat .venv/.req-sha 2>/dev/null || echo none)
          if [ ! -x .venv/bin/python ] || [ "$want" != "$have" ]; then
            echo "building venv"
            rm -rf .venv
            python3 -m venv .venv
            .venv/bin/pip install --quiet --no-cache-dir --upgrade pip
            .venv/bin/pip install --quiet --no-cache-dir -r requirements-model.txt
            echo "$want" > .venv/.req-sha
          else
            echo "reusing venv"
          fi

      - name: Weekly interval recalibration
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            .venv/bin/python calibrate_intervals.py
          else
            echo "not Sunday - skipping recalibration"
          fi

      - name: Commit calibration
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/intervals.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "recalibrate intervals: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
