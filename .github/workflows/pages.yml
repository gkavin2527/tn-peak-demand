name: deploy dashboard

# Builds the static dashboard and publishes it to GitHub Pages.
#
# Triggers on a push that touches the dashboard or the data it reads, so the
# published page follows the daily pipeline without a second schedule. The
# daily/evening jobs commit dashboard/public/data/dashboard.json, which lands
# here as a push and redeploys.
#
# Runs on ubuntu-latest, not the self-hosted runner: this needs Node, and the
# self-hosted box is disk-constrained (it filled up on 2026-11-12). Keeping
# the build off it avoids reintroducing that failure.

on:
  # A push only fires this when a HUMAN pushes. The daily and evening jobs
  # commit the refreshed dashboard.json using the default GITHUB_TOKEN, and
  # GitHub deliberately does not start new workflow runs from token-authored
  # pushes - otherwise a workflow could trigger itself forever. So the data
  # was being committed and the site was never redeploying.
  #
  # workflow_run closes that loop: whenever either data job finishes, this
  # rebuilds and republishes. Without it the public dashboard only ever
  # updated when someone dispatched it by hand.
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["daily data update", "evening forecast"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # On a workflow_run trigger, only publish if the data job actually
    # succeeded. A failed morning run may have left dashboard.json
    # half-written or untouched, and republishing then would either change
    # nothing or ship a partial refresh.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      # Explicit ref: a workflow_run event checks out the default branch by
      # default, but the data commit we are publishing is on main and being
      # implicit about that is how this breaks silently later.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      # The contract test fails if the UI hardcodes a demand-scale number or
      # if the exported JSON is internally inconsistent. Deploying past it
      # would publish exactly the class of error this project has shipped
      # twice before, so it gates the build.
      - name: Data contract tests
        run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
